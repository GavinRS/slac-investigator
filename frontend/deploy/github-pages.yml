# Install at .github/workflows/frontend-pages.yml after reviewing site visibility.
# Intentionally manual: pushing backend changes must not publish the website.
name: Publish investigation frontend
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages-frontend
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test frontend/tests/*.test.js
      - run: node frontend/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
