[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "slac-investigator"
version = "0.1.0"
description = "Human-supervised RF fault evidence investigation"
requires-python = ">=3.11"
dependencies = ["flwr==1.39.0", "openai>=2.16,<3", "numpy>=2,<3", "pandas>=2,<4", "matplotlib>=3.9,<4", "streamlit>=1.40,<2", "h5py>=3.12,<4", "pytest>=8,<10", "fastapi>=0.138,<1", "uvicorn>=0.49,<1"]
[tool.hatch.build.targets.wheel]
packages = ["slac_assistant"]
[tool.flwr.app]
publisher = "hackathon"
flwr-version-target = "1.39.0"
fab-include = ["slac_assistant/**", "data/events/**"]
[tool.flwr.app.components]
agentapp = "slac_assistant.agent_app:app"
[tool.flwr.app.config]
model = "flwrlabs/endeavor-1.0"
node-timeout = 120
